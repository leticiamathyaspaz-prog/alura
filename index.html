<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --cor-primaria: #58111a;
      --cor-secundaria: #800020;
      --cor-fundo: #f9f4f4;
      --cor-card: #ffffff;
      --cor-texto: #333333;
      --cor-contraste: #fffcfc;
      --cor-botao: #fff0f2;
    }

    .tema-escuro {
      --cor-primaria: #ffb3b8;
      --cor-secundaria: #ff8591;
      --cor-fundo: #121212;
      --cor-card: #1e1e1e;
      --cor-texto: #e0e0e0;
      --cor-contraste: #282828;
      --cor-botao: #2c2527;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      margin: 0;
      padding: 20px;
      max-width: 100vw;
    }

    header {
      background-color: var(--cor-primaria); 
      color: var(--cor-contraste);
      text-align: center;
      margin: 0 auto;
      padding: 16px;
      border-radius: 8px 8px 0 0;
    }

    main {
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      border-radius: 0 0 8px 8px;
      border: 1px solid var(--cor-primaria);
      border-top: none;
    }

    article {
      display: flex;
      border: 1px solid var(--cor-primaria);
      margin: 16px 0;
      gap: 16px;
      padding: 16px;
      align-items: center;
      border-radius: 6px;
      background-color: var(--cor-card);
    }

    article:last-child {
      margin-bottom: 0;
    }

    h2 {
      color: var(--cor-primaria); 
      margin-top: 0;
    }

    img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      display: block;
      border-radius: 4px;
    }

    .artigo-autor {
      font-weight: bold;
      color: var(--cor-secundaria);
    }

    .fonte-link {
      color: var(--cor-secundaria);
      text-decoration: underline;
    }

    .fonte-link:hover {
      color: var(--cor-primaria);
    }

    button {
      background-color: var(--cor-botao);
      border: 1px solid var(--cor-primaria);
      color: var(--cor-primaria);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s, color 0.2s;
    }

    button:hover {
      background-color: var(--cor-primaria);
      color: var(--cor-contraste);
    }
  </style>
</head>
<body class="tema-escuro">

  <header>
    <h1>Minha página sobre curiosidades científicas</h1>
    <p>Aqui irei compartilhar algumas curiosidades científicas interessantes</p>
  </header>
