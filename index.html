<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <style>
    header {
      background-color: #25376e;
      color: #FFFFFF;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    main {
      background-color: #FFFFFF;
      color: #25376e;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    img {
      width: 80px;
      height: 80px;
      display: block;
    }

    /* Corrigido o hífen da classe */
    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Minha página sobre curiosidades científicas</h1>
    <p>Aqui irei compartilhar algumas curiosidades científicas interessantes</p>
  </header>
  <main>
    <img src="Gemini_Generated_Image_a2ap1oa2ap1oa2ap.png" alt="Ícone azul de um átomo e uma lupa destacando uma fita de DNA sobre fundo branco.">
    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Leticia Mathyas</p>
      <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar algumas curiosidades científicas.</p>
      <button>❤️ <span>0</span></button>
    </div>   
  </main>

  <script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

    // Corrigido "fuction" para "function"
    function botaoClicado() {
      console.log("fui clicado");
      // Corrigido "ler" para "let"
      let texto = botao.querySelector("span");
      
      // Incrementa o valor numérico
      texto.textContent = Number(texto.textContent) + 1;
    }
  </script>
</body>
</html>
